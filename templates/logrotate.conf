__LOG__ {
    weekly
    rotate 4
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    # copytruncate 下 create 会被忽略；仍声明以便非 copytruncate 路径与文档一致
    create 600 root root
    copytruncate
}

__TRAFFIC_LOG__ {
    weekly
    rotate 4
    maxsize 5M
    compress
    delaycompress
    missingok
    notifempty
    create 600 root root
    copytruncate
}
