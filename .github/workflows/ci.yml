name: CI — shfmt / shellcheck / bats

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats

      - name: Install shfmt (pinned release binary; mvdan/shfmt action is gone)
        run: |
          set -e
          sudo curl -sSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
          shfmt --version

      - name: shfmt (format check)
        run: shfmt -l .

      - name: shellcheck (lint .sh files)
        run: |
          set -e
          FILES=$(git ls-files '*.sh' || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shellcheck -x
          else
            echo "No shell files to lint"
          fi

      - name: Run bats (if tests exist)
        run: |
          set -e
          if [ -d tests ]; then
            echo "Running bats tests..."
            bats --tap tests
          else
            echo "No tests directory; skipping"
          fi
