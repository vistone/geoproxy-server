name: CI — shfmt / shellcheck / bats

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不依赖 apt（runner 的 apt 源偶发挂起会吊死整个 job），
      # 三个工具全部下载固定版本二进制
      - name: Install pinned tools (shfmt / shellcheck / bats)
        run: |
          set -euo pipefail
          sudo curl -sSL --retry 3 -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

          sudo curl -sSL --retry 3 -o /tmp/sc.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo tar -xJf /tmp/sc.tar.xz -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck

          sudo curl -sSL --retry 3 -o /tmp/bats.tgz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          sudo tar -xzf /tmp/bats.tgz -C /usr/local/lib
          sudo ln -s /usr/local/lib/bats-core-1.14.0/bin/bats /usr/local/bin/bats

          shfmt --version
          shellcheck --version | head -2
          bats --version

      - name: shfmt (format check)
        run: shfmt -l .

      - name: shellcheck (lint .sh files)
        run: |
          set -e
          FILES=$(git ls-files '*.sh' || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shellcheck -x
          else
            echo "No shell files to lint"
          fi

      - name: Run bats (if tests exist)
        run: |
          set -e
          if [ -d tests ]; then
            echo "Running bats tests..."
            bats --tap tests
          else
            echo "No tests directory; skipping"
          fi
