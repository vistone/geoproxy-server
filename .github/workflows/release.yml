name: Release — tag → GitHub Release (asset + sha256)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release with verified asset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tag
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="$(tr -d '[:space:]' <VERSION)"
          if [ "$VER" != "$TAG" ]; then
            echo "VERSION($VER) 与 tag($TAG) 不一致" >&2
            exit 1
          fi
          echo "VERSION == tag == $TAG"

      - name: Package release asset
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git archive --format=tar.gz -o "geoproxy-server-${TAG}.tar.gz" "$TAG"
          sha256sum "geoproxy-server-${TAG}.tar.gz" >"geoproxy-server-${TAG}.tar.gz.sha256"
          cat "geoproxy-server-${TAG}.tar.gz.sha256"

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          python3 scripts/extract_release_notes.py "${GITHUB_REF_NAME}" >release-notes.md
          head -5 release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "geoproxy-server-${TAG}.tar.gz" \
            "geoproxy-server-${TAG}.tar.gz.sha256"
